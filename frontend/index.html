<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pixel Izakaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'VT323', monospace; background-color: #0c0a09; color: #f5f5f5; }
    .pixel-title { font-family: 'Press Start 2P', monospace; }
    #gameCanvas { image-rendering: pixelated; }
    #loading-screen { position: fixed; inset: 0; background: #110c08; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 60; transition: opacity 0.8s ease-in-out; }
    .sun-circle { width: 80px; height: 80px; border: 4px solid #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: pulse-sun 1.5s infinite alternate; box-shadow: 0 0 20px rgba(239,68,68,.5); }
    @keyframes pulse-sun { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(1.1); opacity: 1; } }

    /* paneles de cocina y ordenador */
    .kgrid { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 8px; font-size: 19px; }
    .kpanel { background: #0c0a09; border: 2px solid #44200f; border-radius: 4px; padding: 6px 8px; max-height: 300px; overflow-y: auto; }
    .kpanel h3 { color: #fbbf24; font-size: 20px; margin-bottom: 2px; }
    .kitem { margin: 2px 0; line-height: 1.15; }
    .kwrap { display: flex; flex-wrap: wrap; gap: 4px; }
    .muted { color: #78716c; } .small { font-size: 16px; }
    .chip { background: #1c1917; border: 1px solid #57534e; padding: 0 6px; border-radius: 3px; }
    .kbtn { background: #44200f; border: 2px solid #b45309; color: #fde68a; padding: 0 8px; border-radius: 4px; font-size: 18px; cursor: pointer; margin: 1px; }
    .kbtn:hover:not(:disabled) { background: #7c2d12; }
    .kbtn:disabled { opacity: .4; cursor: not-allowed; }
    .kbtn.active { background: #b45309; color: #fff; }
    .kbtn.big { font-size: 24px; padding: 4px 14px; }
    .pcwin { width: 660px; max-height: 80vh; background: #1c1917; border: 4px solid #b45309; border-radius: 8px; font-size: 20px; text-align: left; overflow: hidden; display: flex; flex-direction: column; }
    .pchead { display: flex; justify-content: space-between; background: #0369a1; color: #fff; padding: 6px 12px; font-size: 22px; }
    .pctabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 2px solid #44200f; }
    .pcbody { padding: 10px 14px; overflow-y: auto; }

    /* pantallas de menú */
    .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
    #title-screen { --h: 25; z-index: 45; background: radial-gradient(circle at 50% 30%, hsl(var(--h) 75% 16%), #0c0a09 70%); }
    #title-screen .sun-circle { border-color: hsl(var(--h) 85% 52%); box-shadow: 0 0 20px hsl(var(--h) 85% 52% / .5); }
    #title-screen .sun-circle span { color: hsl(var(--h) 85% 58%); }
    #title-screen .accent, #title-screen .slot-n { color: hsl(var(--h) 90% 62%); }
    #title-screen .slot { border-color: hsl(var(--h) 80% 42%); }
    #title-screen .kbtn { border-color: hsl(var(--h) 80% 45%); background: hsl(var(--h) 60% 16%); color: hsl(var(--h) 90% 82%); }
    #title-screen .kbtn:hover:not(:disabled) { background: hsl(var(--h) 60% 26%); }
    .credit { position: absolute; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
    .credit-author { left: 28px; } .credit-kitten { right: 28px; }
    .frame { width: 112px; height: 112px; background: #fff; border: 5px solid hsl(var(--h) 70% 30%); box-shadow: 0 0 0 3px hsl(var(--h) 80% 50%), 4px 6px 0 #000; overflow: hidden; }
    .frame img { width: 100%; height: 100%; object-fit: cover; }
    .credit-role { font-family: 'Press Start 2P', monospace; font-size: 9px; color: hsl(var(--h) 90% 62%); margin-top: 6px; }
    .credit-name { font-size: 22px; color: #f5f5f5; }
    #kitten { width: 96px; height: 96px; image-rendering: pixelated; animation: kbob 1.1s steps(2) infinite; }
    @keyframes kbob { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    .bubble { background: #fff; color: #1c1917; border: 3px solid #1c1917; border-radius: 8px; padding: 0 10px; font-size: 20px; position: relative; margin-bottom: 8px; }
    .bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; margin-left: -6px; border: 6px solid transparent; border-top-color: #1c1917; border-bottom: 0; }
    @media (max-height: 720px) { .credit { transform: scale(.7); transform-origin: bottom center; } }

    /* pantalla completa: el canvas se ajusta al espacio y los paneles quedan abajo */
    body.fs { padding: 0; display: block; overflow: hidden; }
    body.fs #game-card { width: 100vw; height: 100vh; border-width: 0; border-radius: 0; padding: 6px 12px; display: flex; flex-direction: column; }
    body.fs #game-card h1 { font-size: 14px; margin-bottom: 4px; }
    body.fs #stage { flex: 1; height: auto; min-height: 0; }
    body.fs #bottom { flex: none; max-height: 36vh; overflow-y: auto; }
    body.fs .kgrid { font-size: 21px; }
    #pause-modal { z-index: 46; background: rgba(0,0,0,.7); }
    #confirm-modal { z-index: 48; background: rgba(0,0,0,.6); }
    #end-modal { z-index: 44; inset: auto 0 18px 0; pointer-events: none; }
    #end-modal .pausebox { pointer-events: auto; }
    .title-wrap { text-align: center; }
    .slots { display: flex; gap: 16px; justify-content: center; }
    .slot { width: 220px; background: #1c1917; border: 3px solid #b45309; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 21px; }
    .slot.empty { border-style: dashed; }
    .slot-n { color: #fbbf24; font-size: 24px; }
    .slot-owner b { color: #fff; font-size: 26px; }
    .slot input { background: #0c0a09; border: 2px solid #b45309; color: #fff; font-family: inherit; font-size: 22px; padding: 4px 8px; border-radius: 4px; text-align: center; }
    .pausebox { background: #1c1917; border: 4px solid #b45309; border-radius: 8px; padding: 20px 28px; min-width: 320px; display: flex; flex-direction: column; gap: 10px; text-align: center; font-size: 24px; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <div id="loading-screen">
    <div class="sun-circle mb-4"><span class="text-red-500 pixel-title text-xl">居酒屋</span></div>
    <h2 class="pixel-title text-amber-500 text-sm tracking-widest mb-2">PIXEL IZAKAYA</h2>
    <p class="text-stone-400 text-lg animate-pulse">Preparando la cocina y el salón...</p>
  </div>

  <div id="game-card" class="bg-stone-900 border-4 border-amber-800 p-6 rounded-lg shadow-2xl w-[820px] text-center relative overflow-hidden">
    <h1 class="pixel-title text-lg text-amber-400 mb-3">IZAKAYA DE <span id="owner">...</span></h1>

    <div class="flex flex-wrap justify-around items-center gap-x-4 gap-y-1 text-xl bg-stone-950 p-2 border-2 border-stone-700 mb-3 rounded">
      <span>Fondos: <strong id="coins" class="text-yellow-400">0</strong> ¥</span>
      <span>Valoración: <strong id="rating" class="text-emerald-400">2.00</strong>% <small class="text-stone-500">(tope <span id="cap">2.50</span> · meta 10)</small></span>
      <span>★ <strong id="stars" class="text-yellow-300">0</strong></span>
      <span class="flex items-center gap-2">Nv. <strong id="level" class="text-amber-300">1</strong>/19
        <span class="inline-block w-20 h-3 bg-stone-700 border border-stone-500"><span id="xpbar" class="block h-full bg-amber-500" style="width:0%"></span></span></span>
      <span><button id="fs-btn" class="kbtn" title="Pantalla completa (F)">⛶</button><button id="music-btn" class="kbtn">🔊</button><button id="menu-btn" class="kbtn">☰ Menú</button></span>
    </div>

    <div id="stage" class="border-4 border-amber-950 bg-stone-950 h-[328px] relative overflow-hidden flex items-center justify-center rounded">
      <canvas id="gameCanvas" width="750" height="320"></canvas>
    </div>

    <div id="bottom">
    <div id="kitchen-ui" class="mt-3 text-left"></div>
    <div id="dining-ui" class="mt-3 hidden text-xl text-stone-300">
      Mueve al chef con <b class="text-amber-300">WASD / flechas</b> · <b class="text-amber-300">E</b> (o clic) para cobrar, limpiar o usar el ordenador (arriba a la izquierda) · <b class="text-amber-300">Esc</b>/<b class="text-amber-300">P</b> pausa · <b class="text-amber-300">F</b> pantalla completa.
    </div>

    <div class="mt-4 flex justify-center gap-4 border-t border-stone-800 pt-3">
      <button onclick="window.switchView('counter')" class="text-amber-400 hover:underline text-xl font-bold">⛩️ Cocina</button>
      <span class="text-stone-600">|</span>
      <button onclick="window.switchView('dining')" class="text-amber-400 hover:underline text-xl font-bold">🍵 Salón</button>
    </div>
    </div>
  </div>

  <div id="pc-modal" class="hidden fixed inset-0 bg-black/70 items-center justify-center z-40"></div>
  <div id="title-screen" class="overlay"></div>
  <div id="pause-modal" class="overlay"></div>
  <div id="confirm-modal" class="overlay"></div>
  <div id="end-modal" class="overlay"></div>
  <div id="toasts" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <script type="module" src="./src/app.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 800); }
      }, 1200);
    });
  </script>
</body>
</html>
